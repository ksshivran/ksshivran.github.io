<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <!-- Fonts: Libre Franklin (text) and Fira Code (code, dates, tiles). Falls back to system fonts if blocked. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Libre+Franklin:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css?v={{ site.time | date: '%Y%m%d%H%M%S' }}">

  <!-- Maths: write $$ ... $$ in any page or post. Remove this block to turn maths off. -->
  <script>
    window.MathJax = { tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] } };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>
</head>
<body class="{{ page.body_class }}">
  <header class="site-header">
    <div class="wrap">
      <a class="site-name" href="/">{{ site.title }}</a>
      <nav>
        {% for item in site.data.nav %}
          <a href="{{ item.url }}"{% if page.url == item.url or page.url contains item.url and item.url != "/" %} class="active"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="wrap">
    <p>&copy; 2026 {{ site.title }} &middot; Department of Electrical Engineering, IISc Bengaluru</p>
  </footer>
</body>
</html>
